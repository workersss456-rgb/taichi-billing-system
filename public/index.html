<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程請款／付款申請</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="front">

<div class="toast-stack" id="toast-stack"></div>

<!-- ========== 身分識別 ========== -->
<div class="login-screen" id="id-screen">
  <div class="login-card">
    <div class="brand-mark">帳</div>
    <h2>工程請款／付款申請</h2>

    <div id="phone-step">
      <p class="sub">不需要密碼，輸入手機號碼辨識身分即可。</p>
      <div class="field"><input type="tel" id="phone-input" placeholder="聯絡手機" inputmode="numeric"></div>
      <button class="btn btn-primary btn-block" id="phone-btn">查詢 / 登入</button>
      <p class="small-note">第一次使用？輸入手機後按上面按鈕，系統會請您補填姓名完成建檔。</p>
    </div>

    <div id="register-step" style="display:none;">
      <p class="sub">查不到這組手機，請補填基本資料。</p>
      <div class="field"><label class="req">姓名</label><input type="text" id="reg-name"></div>
      <div class="field"><label>員工編號（選填）</label><input type="text" id="reg-no"></div>
      <button class="btn btn-primary btn-block" id="reg-btn">完成建檔</button>
      <button class="btn btn-secondary btn-block" id="reg-back" style="margin-top:8px;">← 換一組手機號碼</button>
    </div>

    <p class="small-note danger" id="id-error"></p>
    <a class="small-note" href="admin.html" style="display:block; margin-top:14px;">🔒 財務後台登入 →</a>
  </div>
</div>

<!-- ========== 主畫面 ========== -->
<div class="front-shell" id="shell" style="display:none;">
  <header class="front-header">
    <div class="brand"><span class="brand-mark">帳</span>請款／付款申請</div>
    <div class="front-user">
      <span id="who"></span>
      <button class="btn btn-secondary btn-sm" id="switch-user">切換</button>
      <a class="btn btn-sm switch-link" href="admin.html" title="財務與主管使用，需要後台密碼">🔒 財務後台</a>
    </div>
  </header>

  <nav class="front-tabs">
    <button class="front-tab active" data-panel="new">填寫申請單</button>
    <button class="front-tab" data-panel="mine">我的申請單</button>
  </nav>

  <main class="front-main">

    <!-- ---------- 填寫申請單 ---------- -->
    <section class="panel active" id="panel-new">
      <div class="kind-tabs">
        <button class="kind-tab active" data-kind="billing"><strong>請款申請單</strong><span>向客戶／業主請款</span></button>
        <button class="kind-tab" data-kind="payment"><strong>付款申請單</strong><span>支付款項給廠商</span></button>
      </div>

      <div class="card">
        <h3>基本資訊</h3>
        <div class="grid-2">
          <div class="field"><label class="req">申請類型</label>
            <select id="f-request-type">
              <option>一般工程款</option><option>點工費用</option><option>材料採購</option><option>零用金核銷</option>
            </select>
          </div>
          <div class="field"><label class="req">歸屬公司</label><select id="f-company"></select></div>
        </div>

        <div class="field">
          <label class="req" id="f-party-label">請款對象（客戶／業主）</label>
          <div class="search-box">
            <input type="text" id="party-search" placeholder="輸入公司名稱或統一編號搜尋" autocomplete="off">
            <div class="search-results" id="party-results" style="display:none;"></div>
          </div>
          <div class="picked" id="party-picked" style="display:none;">
            <span id="party-picked-name"></span>
            <button class="icon-btn" id="party-clear">✕ 重選</button>
          </div>
        </div>

        <div class="grid-2">
          <div class="field"><label>案場名稱</label><select id="f-site"></select></div>
          <div class="field"><label>發票／憑證號碼</label><input type="text" id="f-invoice-no" placeholder="例如 CA21298403、收據、免用發票"></div>
          <div class="field"><label>單據開立日期</label><input type="date" id="f-invoice-date"></div>
          <div class="field"><label>希望撥款／收款日</label><input type="date" id="f-due-date"></div>
        </div>
        <label class="checkline"><input type="checkbox" id="f-tax-free"> 本單據為免稅／無稅額（政府規費、收據等）</label>
      </div>

      <div class="card">
        <div class="card-head"><h3>品項明細</h3><button class="btn btn-secondary btn-sm" id="add-item-row">＋ 新增品項列</button></div>
        <div class="table-wrap">
          <table class="table" id="item-table">
            <thead><tr>
              <th style="min-width:160px;">品名／規格</th><th style="width:80px;">數量</th><th style="width:70px;">單位</th>
              <th style="width:100px;">單價</th><th style="width:100px;">未稅</th><th style="width:100px;">含稅</th><th style="width:40px;"></th>
            </tr></thead>
            <tbody id="item-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>照片／憑證</h3>
          <label class="btn btn-secondary btn-sm">拍照 / 選擇照片
            <input type="file" id="f-photos" accept="image/*" capture="environment" multiple hidden>
          </label>
        </div>
        <p class="small-note" id="photo-count">已選擇 0 張</p>
        <div class="photo-grid" id="photo-preview"></div>
      </div>

      <div class="card">
        <div class="field"><label>說明／備註</label><textarea id="f-note" rows="2"></textarea></div>
      </div>

      <div class="totals">
        <div>小計（未稅）：NT$ <span id="t-subtotal">0</span></div>
        <div>營業稅（<span id="t-tax-label">5%</span>）：NT$ <span id="t-tax">0</span></div>
        <div class="net">含稅總計：NT$ <span id="t-total">0</span></div>
        <p class="small-note">保留款、扣款與收款帳戶由財務於核簽時處理。</p>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary btn-lg" id="submit-btn">確認送出</button>
      </div>
    </section>

    <!-- ---------- 我的申請單 ---------- -->
    <section class="panel" id="panel-mine">
      <div class="filter-bar">
        <div class="field"><label>類別</label><select id="q-kind">
          <option value="">全部</option><option value="billing">請款</option><option value="payment">付款</option>
        </select></div>
        <div class="field"><label>關鍵字</label><input type="text" id="q-keyword" placeholder="單號／發票號／對象／案場"></div>
        <button class="btn btn-primary" id="q-search">查詢</button>
      </div>
      <p class="small-note">這裡只會顯示您自己送出的申請單。</p>
      <div id="mine-result"></div>
    </section>

  </main>
</div>

<!-- ========== 新增廠商／客戶 ========== -->
<div class="modal-backdrop" id="party-modal" style="display:none;">
  <div class="modal">
    <h3 id="party-modal-title">建立新的對象</h3>
    <p class="small-note">系統裡查不到這家公司，請補上基本資料後繼續。銀行帳戶由財務於核簽時填寫。</p>
    <div class="field"><label class="req">公司名稱</label><input type="text" id="np-name"></div>
    <div class="field"><label>統一編號</label><input type="text" id="np-taxid" inputmode="numeric"></div>
    <div class="field"><label>負責人</label><input type="text" id="np-person"></div>
    <div class="field"><label>聯絡電話</label><input type="text" id="np-phone"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="np-save">建立並選用</button>
      <button class="btn btn-secondary" id="np-cancel">取消</button>
    </div>
  </div>
</div>

<script src="js/front.js"></script>
</body>
</html>
